
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unique Sign-In Form</title>
    <link rel="stylesheet" href="link.css">
</head>
<body>
    <div class="container">
        <div class="left-section">
            <img src="city-sparkles-light-streets-night.jpg"alt="Welcome" class="welcome-image">
            <h2>Welcome Back!</h2>
            <p>Sign in to continue to your dashboard.</p>
        </div>
        <div class="right-section">
            <form class="sign-in-form" onsubmit="handleSubmit(event)"></form>
                <h2>Sign In</h2>
                <div class="input-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="Enter your email" required>
                </div>
                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Enter your password" required>
                    <span class="toggle-password" onclick="togglePassword()">👁</span>
                </div>
                <button type="submit" class="sign-in-button">Sign In</button>
                <div class="social-login">
                    <button class="google-login">Sign in with Google</button>
                    <button class="facebook-login">Sign in with Facebook</button>
                </div>
            </form>
        </div>
    </div>

    <script src="link.js"></script>
</body>
</html>
