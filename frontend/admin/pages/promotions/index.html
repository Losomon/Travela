<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Travela — Promotions</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <link rel="stylesheet" href="../../assets/css/pages/promotions.css">
</head>
<body class="theme-light">
    <div class="app">
        <div id="sidebar-container"></div>
        <main class="main-content">
            <div id="header-container"></div>
            <div class="promotions-page">
                <div class="ai-intel-banner fade-up visible">
                    <div class="ai-greeting">Promotions Management</div>
                    <div class="ai-insight-text">
                        12 active campaigns. Summer sale generating 32% of revenue.
                    </div>
                    <div class="ai-actions">
                        <div class="ai-action-chip">Create Campaign 🎯</div>
                        <div class="ai-action-chip">A/B Test 📊</div>
                        <div class="ai-action-chip">View Performance 💰</div>
                    </div>
                </div>
                <div class="metrics-bento">
                    <div class="metric-hero">
                        <div class="metric-title">Active Campaigns</div>
                        <div class="metric-value">12</div>
                        <div class="metric-trend trend-up">↑ 2 new launches</div>
                    </div>
                    <div class="metric-hero">
                        <div class="metric-title">Total Discount</div>
                        <div class="metric-value">$42K</div>
                        <div class="metric-trend trend-up">↑ 8.4% vs last month</div>
                    </div>
                    <div class="metric-hero">
                        <div class="metric-title">Conversion Rate</div>
                        <div class="metric-value">12.4%</div>
                        <div class="metric-trend trend-up">↑ 2.1% vs average</div>
                    </div>
                    <div class="metric-hero">
                        <div class="metric-title">Revenue Impact</div>
                        <div class="metric-value">$1.2M</div>
                        <div class="metric-trend trend-up">↑ 22.1% boost</div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="../js/index.js"></script>
</body>
</html>
