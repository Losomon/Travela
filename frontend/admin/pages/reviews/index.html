<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Travela — Reviews</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <link rel="stylesheet" href="../../assets/css/pages/reviews.css">
</head>
<body class="theme-light">
    <div class="app">
        <div id="sidebar-container"></div>
        <main class="main-content">
            <div id="header-container"></div>
            <div class="reviews-page">
                <div class="ai-intel-banner fade-up visible">
                    <div class="ai-greeting">Reviews & Ratings</div>
                    <div class="ai-insight-text">
                        2,847 reviews with 4.8 avg rating. 89% positive sentiment.
                    </div>
                    <div class="ai-actions">
                        <div class="ai-action-chip">Reply to Reviews 💬</div>
                        <div class="ai-action-chip">Sentiment Analysis 📊</div>
                        <div class="ai-action-chip">Export Report 📤</div>
                    </div>
                </div>
                <div class="metrics-bento">
                    <div class="metric-hero">
                        <div class="metric-title">Total Reviews</div>
                        <div class="metric-value">2,847</div>
                        <div class="metric-trend trend-up">↑ 156 this week</div>
                    </div>
                    <div class="metric-hero">
                        <div class="metric-title">Avg Rating</div>
                        <div class="metric-value">4.8</div>
                        <div class="metric-trend trend-up">↑ 0.1 vs last 30 days</div>
                    </div>
                    <div class="metric-hero">
                        <div class="metric-title">Response Rate</div>
                        <div class="metric-value">94%</div>
                        <div class="metric-trend trend-up">↑ 2% vs target</div>
                    </div>
                    <div class="metric-hero">
                        <div class="metric-title">Positive %</div>
                        <div class="metric-value">89%</div>
                        <div class="metric-trend trend-up">↑ 3% vs last month</div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="../js/index.js"></script>
</body>
</html>
