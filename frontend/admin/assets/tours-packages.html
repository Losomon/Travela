<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Travela – Tours & Packages</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:#f5f6fa;display:flex;height:100vh;overflow:hidden;color:#1a1d23;font-size:13px}
button,a{font-family:'DM Sans',sans-serif;cursor:pointer;text-decoration:none;border:none;background:none}
::-webkit-scrollbar{width:4px;height:4px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:#dde1e9;border-radius:99px}
#sidebar{width:216px;min-width:216px;background:#fff;display:flex;flex-direction:column;border-right:1px solid #eef0f5;overflow-y:auto;overflow-x:hidden}
.logo-wrap{padding:18px 16px 14px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #f3f4f8;flex-shrink:0}
.logo-icon{width:36px;height:36px;background:linear-gradient(135deg,#5b5ef6,#7b7ef8);border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.logo-icon svg{width:18px;height:18px;stroke:#fff;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.brand{font-size:14px;font-weight:700;color:#1a1d23}.brand-sub{font-size:10.5px;color:#9aa3b2}
nav{padding:8px 8px 0;flex:1}
.nb{width:100%;display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:9px;color:#6b7585;font-size:12.5px;font-weight:500;text-align:left;margin-bottom:1px;transition:all .14s}
.nb svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.nb:hover{background:#f5f6fa;color:#1a1d23}.nb.active{background:#5b5ef6;color:#fff}
.nba{background:#e8403c;color:#fff;border-radius:99px;font-size:10px;padding:1px 6px;font-weight:700;margin-left:auto}
.narr{margin-left:auto;opacity:.5;width:12px!important;height:12px!important}
.sb-promo{margin:10px 8px 8px;border-radius:12px;overflow:hidden;position:relative;min-height:100px;background:#1e2435}
.sb-promo-c{position:relative;z-index:1;padding:12px}
.sb-promo-c p{font-size:11.5px;color:#fff;font-weight:600;line-height:1.4;margin-bottom:10px}
.pb{display:inline-flex;align-items:center;gap:5px;background:#fff;color:#1a1d23;border-radius:7px;padding:5px 11px;font-size:11.5px;font-weight:600}
#main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
header{background:#fff;border-bottom:1px solid #eef0f5;padding:0 22px;height:60px;display:flex;align-items:center;gap:10px;flex-shrink:0}
.srch{display:flex;align-items:center;gap:7px;background:#f7f8fc;border:1px solid #eef0f5;border-radius:9px;padding:7px 12px;width:260px}
.srch svg{width:13px;height:13px;stroke:#9aa3b2;fill:none;stroke-width:2;stroke-linecap:round;flex-shrink:0}
.srch span{font-size:12px;color:#9aa3b2;flex:1}.srch kbd{font-size:10px;color:#c0c7d3;border:1px solid #e5e8ef;border-radius:4px;padding:1px 5px}
.tend{display:flex;align-items:center;gap:8px;margin-left:auto}
.lchip{display:flex;align-items:center;gap:5px;background:#edfaf4;border-radius:99px;padding:5px 12px;border:1px solid #c8f0df}
.ldot{width:7px;height:7px;background:#22c55e;border-radius:50%}
.lchip span{font-size:11.5px;color:#15803d;font-weight:500}
.lchip .lc{background:#5b5ef6;color:#fff;border-radius:99px;font-size:10.5px;padding:1px 6px;font-weight:700}
.tibtn{border:1px solid #eef0f5;background:#fff;border-radius:9px;width:36px;height:36px;display:flex;align-items:center;justify-content:center;color:#6b7585;position:relative;flex-shrink:0}
.tibtn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.nbdg{position:absolute;top:-4px;right:-4px;background:#e8403c;color:#fff;border-radius:99px;font-size:9px;padding:1px 4px;font-weight:700;border:1.5px solid #fff}
.lpill{display:flex;align-items:center;gap:5px;border:1px solid #eef0f5;background:#fff;border-radius:9px;padding:5px 11px;font-size:12px;color:#374151;font-weight:500}
.lpill svg{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:2}
.avblk{display:flex;align-items:center;gap:8px}
.av{width:33px;height:33px;border-radius:50%;background:linear-gradient(135deg,#5b5ef6,#818cf8);display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:700;flex-shrink:0}
.av-n{font-size:12px;font-weight:600;color:#1a1d23;line-height:1.2}.av-r{font-size:10px;color:#9aa3b2}
#content{flex:1;overflow-y:auto;padding:20px 22px}
.pg-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.pg-hd h1{font-size:20px;font-weight:700;color:#1a1d23}
.abtn{display:flex;align-items:center;gap:7px;background:#5b5ef6;color:#fff;border-radius:9px;padding:8px 16px;font-size:13px;font-weight:600}
.abtn svg{width:13px;height:13px;stroke:#fff;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.obtn{display:flex;align-items:center;gap:6px;border:1px solid #dde1ea;background:#fff;border-radius:9px;padding:7px 13px;font-size:12.5px;font-weight:500;color:#374151}
.obtn svg{width:12px;height:12px;stroke:#6b7585;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tabs{display:flex;gap:0;border-bottom:1px solid #eef0f5;margin-bottom:18px}
.tab{padding:8px 16px;font-size:13px;font-weight:500;color:#6b7585;border-bottom:2.5px solid transparent;margin-bottom:-1px;cursor:pointer}
.tab.active{color:#5b5ef6;border-bottom-color:#5b5ef6;font-weight:600}
.fbar{display:flex;align-items:center;gap:8px;margin-bottom:18px}
.sinp{display:flex;align-items:center;gap:7px;background:#f7f8fc;border:1px solid #eef0f5;border-radius:9px;padding:7px 12px;width:220px}
.sinp svg{width:13px;height:13px;stroke:#9aa3b2;fill:none;stroke-width:2;stroke-linecap:round;flex-shrink:0}
.sinp input{border:none;background:none;font-size:12px;color:#1a1d23;outline:none;width:100%;font-family:'DM Sans',sans-serif}
.sinp input::placeholder{color:#9aa3b2}
.sel{border:1px solid #dde1ea;background:#fff;border-radius:9px;padding:7px 12px;font-size:12px;color:#374151;font-family:'DM Sans',sans-serif;outline:none}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.tcard{background:#fff;border-radius:13px;border:1px solid #eef0f5;overflow:hidden}
.tcard-img{height:140px;position:relative;overflow:hidden;background:#e2e8f0}
.tcard-img svg{width:100%;height:100%}
.feat-tag{position:absolute;top:10px;left:10px;background:#5b5ef6;color:#fff;border-radius:6px;padding:3px 9px;font-size:10.5px;font-weight:600}
.tcard-body{padding:13px}
.tcard-title{font-size:13.5px;font-weight:700;color:#1a1d23;margin-bottom:2px}
.tcard-loc{font-size:11.5px;color:#9aa3b2;margin-bottom:10px;display:flex;align-items:center;gap:4px}
.tcard-loc svg{width:11px;height:11px;stroke:#9aa3b2;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tcard-price{font-size:16px;font-weight:700;color:#5b5ef6}
.tcard-price span{font-size:11px;color:#9aa3b2;font-weight:400}
.tcard-stats{display:flex;gap:10px;margin-top:8px;padding-top:8px;border-top:1px solid #f3f4f8}
.ts{font-size:11px;color:#9aa3b2;display:flex;align-items:center;gap:3px}
.ts b{color:#374151;font-weight:600}
.ts svg{width:11px;height:11px;stroke:#9aa3b2;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.star-r{color:#f59e0b;font-size:12px}
.bdg{border-radius:99px;padding:3px 10px;font-size:11px;font-weight:500;white-space:nowrap;display:inline-block}
.bg{background:#dcfce7;color:#15803d}.bam{background:#fef3c7;color:#b45309}.br{background:#fee2e2;color:#b91c1c}
</style>

<script>
const tours=[
  {title:'Bali Paradise',loc:'Bali, Indonesia',price:'$1,250',per:'per person',rating:'4.8',reviews:1125,bookings:328,days:7,status:'Active',feat:true,col1:'#1a6b5a',col2:'#2d9e7a'},
  {title:'Switzerland Trip',loc:'Zurich, Switzerland',price:'$2,780',per:'per person',rating:'4.6',reviews:892,bookings:218,days:10,status:'Active',feat:true,col1:'#1e3a5f',col2:'#2a5298'},
  {title:'Iceland Adventure',loc:'Reykjavik, Iceland',price:'$1,890',per:'per person',rating:'4.7',reviews:647,bookings:198,days:6,status:'Active',feat:false,col1:'#2d4a6e',col2:'#1a3350'},
  {title:'Maldives Escape',loc:'Maldives',price:'$2,450',per:'per person',rating:'4.9',reviews:1036,bookings:410,days:8,status:'Active',feat:true,col1:'#0c7b8a',col2:'#14a8bc'},
  {title:'Paris Getaway',loc:'Paris, France',price:'$980',per:'per person',rating:'4.4',reviews:542,bookings:165,days:5,status:'Active',feat:false,col1:'#5a3e6b',col2:'#7d5c99'},
  {title:'Kenya Safari',loc:'Kenya',price:'$3,200',per:'per person',rating:'4.8',reviews:440,bookings:120,days:9,status:'Active',feat:false,col1:'#7a4419',col2:'#c0722d'},
  {title:'Dubai City Tour',loc:'Dubai, UAE',price:'$760',per:'per person',rating:'4.2',reviews:298,bookings:88,days:4,status:'Active',feat:false,col1:'#c4920a',col2:'#e8b230'},
  {title:'Turkey Explorer',loc:'Istanbul, Turkey',price:'$1,320',per:'per person',rating:'4.5',reviews:380,bookings:142,days:8,status:'Active',feat:false,col1:'#8b1a1a',col2:'#b52d2d'},
];
const grid=document.getElementById('tourGrid');
const gradients=['linear-gradient(135deg,#1a6b5a,#2d9e7a)','linear-gradient(135deg,#1e3a5f,#2a5298)','linear-gradient(135deg,#2d4a6e,#1a3350)','linear-gradient(135deg,#0c7b8a,#14a8bc)','linear-gradient(135deg,#5a3e6b,#7d5c99)','linear-gradient(135deg,#7a4419,#c0722d)','linear-gradient(135deg,#c4920a,#e8b230)','linear-gradient(135deg,#8b1a1a,#b52d2d)'];
tours.forEach((t,i)=>{
  grid.innerHTML+=`<div class="tcard">
    <div class="tcard-img" style="background:${gradients[i]}">
      ${t.feat?'<span class="feat-tag">Featured</span>':''}
      <svg viewBox="0 0 280 140" xmlns="http://www.w3.org/2000/svg" style="opacity:.3">
        <polygon points="0,100 50,55 100,75 150,35 200,60 250,30 280,50 280,140 0,140" fill="rgba(255,255,255,.15)"/>
        <polygon points="0,115 60,80 120,95 180,62 240,80 280,65 280,140 0,140" fill="rgba(0,0,0,.2)"/>
      </svg>
    </div>
    <div class="tcard-body">
      <div class="tcard-title">${t.title}</div>
      <div class="tcard-loc"><svg viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>${t.loc}</div>
      <div style="display:flex;align-items:baseline;justify-content:space-between">
        <div class="tcard-price">${t.price} <span>${t.per}</span></div>
        <span class="bdg bg">${t.status}</span>
      </div>
      <div class="tcard-stats">
        <div class="ts"><span class="star-r">★</span><b>${t.rating}</b>(${t.reviews})</div>
        <div class="ts"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="3" y1="10" x2="21" y2="10"/></svg><b>${t.bookings}</b> Bookings</div>
        <div class="ts"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg><b>${t.days}</b> Days</div>
      </div>
    </div>
  </div>`;
});
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',function(){document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));this.classList.add('active')}));

// Init Choices.js on the filter selects
window.addEventListener('DOMContentLoaded', () => {
  try {
    const selects = document.querySelectorAll('select.sel');
    selects.forEach((sel) => {
      // Avoid double-init if page re-renders
      if (sel.dataset && sel.dataset.choicesInitialized === 'true') return;
      new Choices(sel, {
        searchEnabled: true,
        itemSelectText: '',
        shouldSort: false,
      });
      if (sel.dataset) sel.dataset.choicesInitialized = 'true';
    });
  } catch (e) {
    console.error('Choices init failed', e);
  }
});
</script>
</body>
