<!-- Activity Feed Widget -->
<div class="activity-feed-widget">
    <div class="widget-header">
        <h3 class="widget-title">Live Activity</h3>
        <div class="live-status">
            <div class="live-dot"></div>
            <span>Live</span>
        </div>
    </div>
    <div class="feed-items" id="activityFeedItems">
        <!-- Dynamic items will be injected here -->
        <div class="feed-item-template" style="display: none;">
            <div class="feed-icon"></div>
            <div class="feed-content">
                <div class="feed-title"></div>
                <div class="feed-time"></div>
            </div>
        </div>
    </div>
    <div class="widget-footer">
        <button class="btn-ghost btn-sm view-all-btn">View All Activity →</button>
    </div>
</div>
