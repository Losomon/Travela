<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Travela — Blog CMS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <link rel="stylesheet" href="../../assets/css/pages/blog.css">
</head>
<body class="theme-light">
    <div class="app">
        <div id="sidebar-container"></div>
        <main class="main-content">
            <div id="header-container"></div>
            <div class="blog-page">
                <div class="ai-intel-banner fade-up visible">
                    <div class="ai-greeting">Blog CMS Management</div>
                    <div class="ai-insight-text">
                        156 published articles. Top performing: Bali travel guide with 12K views.
                    </div>
                    <div class="ai-actions">
                        <div class="ai-action-chip">Write New Post ✍️</div>
                        <div class="ai-action-chip">SEO Analysis 🔍</div>
                        <div class="ai-action-chip">Content Insights 📊</div>
                    </div>
                </div>
                <div class="metrics-bento">
                    <div class="metric-hero">
                        <div class="metric-title">Published Posts</div>
                        <div class="metric-value">156</div>
                        <div class="metric-trend trend-up">↑ 8 this month</div>
                    </div>
                    <div class="metric-hero">
                        <div class="metric-title">Total Views</div>
                        <div class="metric-value">84K</div>
                        <div class="metric-trend trend-up">↑ 12.4% vs last 30 days</div>
                    </div>
                    <div class="metric-hero">
                        <div class="metric-title">Top Post</div>
                        <div class="metric-value">Bali Guide</div>
                        <div class="metric-trend trend-up">12K views</div>
                    </div>
                    <div class="metric-hero">
                        <div class="metric-title">Engagement</div>
                        <div class="metric-value">4.2 min</div>
                        <div class="metric-trend trend-up">↑ 0.3 min avg read</div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="../js/index.js"></script>
</body>
</html>
