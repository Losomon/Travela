<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Travela — Destinations</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <link rel="stylesheet" href="../../assets/css/pages/destinations.css">
</head>
<body class="theme-light">
    <div class="app">
        <div id="sidebar-container"></div>
        <main class="main-content">
            <div id="header-container"></div>
            <div class="destinations-page">
                <div class="ai-intel-banner fade-up visible">
                    <div class="ai-greeting">Destinations Management</div>
                    <div class="ai-insight-text">
                        48 destinations across 15 countries. Bali leading with 22% of bookings.
                    </div>
                    <div class="ai-actions">
                        <div class="ai-action-chip">Add Destination 🌍</div>
                        <div class="ai-action-chip">View Map 📍</div>
                        <div class="ai-action-chip">Seasonal Report 📊</div>
                    </div>
                </div>
                <div class="metrics-bento">
                    <div class="metric-hero">
                        <div class="metric-title">Total Destinations</div>
                        <div class="metric-value">48</div>
                        <div class="metric-trend trend-up">↑ 4 new this quarter</div>
                    </div>
                    <div class="metric-hero">
                        <div class="metric-title">Countries Covered</div>
                        <div class="metric-value">15</div>
                        <div class="metric-trend trend-up">↑ 2 new markets</div>
                    </div>
                    <div class="metric-hero">
                        <div class="metric-title">Popular Pick</div>
                        <div class="metric-value">Bali</div>
                        <div class="metric-trend trend-up">22% of bookings</div>
                    </div>
                    <div class="metric-hero">
                        <div class="metric-title">Avg Duration</div>
                        <div class="metric-value">4.2 days</div>
                        <div class="metric-trend trend-up">↑ 0.3 vs last month</div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="../js/index.js"></script>
</body>
</html>
