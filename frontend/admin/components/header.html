<!-- Header Component - Glass Morphism Top Bar -->
<header class="workspace-header">
    <div class="header-left">
        <button class="mobile-menu-toggle" id="mobileMenuToggle" aria-label="Menu">
            ☰
        </button>
        <div class="workspace-switcher" id="workspaceSwitcher">
            <div class="workspace-switcher-icon"></div>
            <span>The Coconut Saraih</span>
            <span>▼</span>
        </div>
        <div class="env-badge production">Live</div>
        <button class="ai-assistant-btn" id="aiAssistantBtn">
            <span>✨</span>
            <span>AI Assistant</span>
        </button>
    </div>
    
    <div class="header-right">
        <div class="command-search" id="commandSearch">
            <span>🔍</span>
            <span>Search or type a command...</span>
            <kbd>⌘K</kbd>
        </div>
        
        <div class="live-status">
            <div class="live-dot"></div>
            <span class="live-text">Live</span>
        </div>
        
        <button class="notification-btn" id="notificationBtn">
            <span>🔔</span>
            <div class="notification-badge"></div>
        </button>
        
        <div class="team-presence" id="teamPresence">
            <div class="presence-avatar active" title="John Doe">JD</div>
            <div class="presence-avatar" title="Sarah Kim">SK</div>
            <div class="presence-avatar" title="Mike Lee">ML</div>
            <div class="presence-avatar" title="+2 more">+2</div>
        </div>
        
        <button class="dark-btn" id="themeToggle" aria-label="Toggle Theme">
            🌙
        </button>
        
        <div class="user-menu" id="userMenu">
            <div class="user-avatar">AU</div>
            <div class="user-info">
                <div class="user-name">Admin</div>
                <div class="user-email">admin@travela.com</div>
            </div>
        </div>
    </div>
</header>
