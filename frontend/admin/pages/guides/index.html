<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Travela — Tour Guides</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <link rel="stylesheet" href="../../assets/css/pages/tour-guides.css">
</head>
<body class="theme-light">
    <div class="app">
        <div id="sidebar-container"></div>
        <main class="main-content">
            <div id="header-container"></div>
            <div class="guides-page">
                <div class="ai-intel-banner fade-up visible">
                    <div class="ai-greeting">Tour Guides Management</div>
                    <div class="ai-insight-text">
                        84 certified guides across 15 destinations. 4.9/5 avg rating.
                    </div>
                    <div class="ai-actions">
                        <div class="ai-action-chip">Add Guide 👨‍✈️</div>
                        <div class="ai-action-chip">Verify Certification ✅</div>
                        <div class="ai-action-chip">Performance Report 📊</div>
                    </div>
                </div>
                <div class="metrics-bento">
                    <div class="metric-hero">
                        <div class="metric-title">Active Guides</div>
                        <div class="metric-value">84</div>
                        <div class="metric-trend trend-up">↑ 5 new hires</div>
                    </div>
                    <div class="metric-hero">
                        <div class="metric-title">Avg Rating</div>
                        <div class="metric-value">4.9</div>
                        <div class="metric-trend trend-up">↑ 0.1 vs last 30 days</div>
                    </div>
                    <div class="metric-hero">
                        <div class="metric-title">Tours Led</div>
                        <div class="metric-value">1,248</div>
                        <div class="metric-trend trend-up">↑ 12.4% vs last month</div>
                    </div>
                    <div class="metric-hero">
                        <div class="metric-title">Countries</div>
                        <div class="metric-value">15</div>
                        <div class="metric-trend trend-up">Global coverage</div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="../js/index.js"></script>
</body>
</html>
