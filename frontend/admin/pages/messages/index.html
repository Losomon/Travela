<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Travela — Messages</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <link rel="stylesheet" href="../../assets/css/pages/messages.css">
</head>
<body class="theme-light">
    <div class="app">
        <div id="sidebar-container"></div>
        <main class="main-content">
            <div id="header-container"></div>
            <div class="messages-page">
                <div class="ai-intel-banner fade-up visible">
                    <div class="ai-greeting">Messages Center</div>
                    <div class="ai-insight-text">
                        42 unread messages. Average response time: 2.4 hours.
                    </div>
                    <div class="ai-actions">
                        <div class="ai-action-chip">New Message 💬</div>
                        <div class="ai-action-chip">Bulk Reply 📧</div>
                        <div class="ai-action-chip">Message Analytics 📊</div>
                    </div>
                </div>
                <div class="metrics-bento">
                    <div class="metric-hero">
                        <div class="metric-title">Unread Messages</div>
                        <div class="metric-value">42</div>
                        <div class="metric-trend trend-down">↓ 12 vs yesterday</div>
                    </div>
                    <div class="metric-hero">
                        <div class="metric-title">Avg Response</div>
                        <div class="metric-value">2.4h</div>
                        <div class="metric-trend trend-down">↓ 0.3h improvement</div>
                    </div>
                    <div class="metric-hero">
                        <div class="metric-title">Open Rate</div>
                        <div class="metric-value">89%</div>
                        <div class="metric-trend trend-up">↑ 5% vs last month</div>
                    </div>
                    <div class="metric-hero">
                        <div class="metric-title">Resolved</div>
                        <div class="metric-value">94%</div>
                        <div class="metric-trend trend-up">↑ 2% vs SLA</div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="../js/index.js"></script>
</body>
</html>
