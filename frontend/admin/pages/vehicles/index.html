<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Travela — Vehicles</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <link rel="stylesheet" href="../../assets/css/pages/vehicles.css">
</head>
<body class="theme-light">
    <div class="app">
        <div id="sidebar-container"></div>
        <main class="main-content">
            <div id="header-container"></div>
            <div class="vehicles-page">
                <div class="ai-intel-banner fade-up visible">
                    <div class="ai-greeting">Vehicles Management</div>
                    <div class="ai-insight-text">
                        32 vehicles across 4 categories. 96% utilization rate.
                    </div>
                    <div class="ai-actions">
                        <div class="ai-action-chip">Add Vehicle 🚗</div>
                        <div class="ai-action-chip">Schedule Maintenance 🔧</div>
                        <div class="ai-action-chip">Usage Report 📊</div>
                    </div>
                </div>
                <div class="metrics-bento">
                    <div class="metric-hero">
                        <div class="metric-title">Total Vehicles</div>
                        <div class="metric-value">32</div>
                        <div class="metric-trend trend-up">↑ 3 new additions</div>
                    </div>
                    <div class="metric-hero">
                        <div class="metric-title">Utilization</div>
                        <div class="metric-value">96%</div>
                        <div class="metric-trend trend-up">↑ 2.4% vs last month</div>
                    </div>
                    <div class="metric-hero">
                        <div class="metric-title">Maintenance Due</div>
                        <div class="metric-value">3</div>
                        <div class="metric-trend trend-down">↓ 2 vs last week</div>
                    </div>
                    <div class="metric-hero">
                        <div class="metric-title">Fuel Efficiency</div>
                        <div class="metric-value">28 MPG</div>
                        <div class="metric-trend trend-up">↑ 1.2 MPG improvement</div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="../js/index.js"></script>
</body>
</html>
