<!-- Stats Widget -->
<div class="stats-widget">
    <div class="widget-header">
        <h3 class="widget-title">{{title}}</h3>
        <div class="widget-action">
            <button class="btn-icon" aria-label="Refresh">🔄</button>
        </div>
    </div>
    <div class="stats-grid">
        <div class="stat-item" data-stat="today">
            <div class="stat-value">{{todayValue}}</div>
            <div class="stat-label">Today</div>
        </div>
        <div class="stat-item" data-stat="week">
            <div class="stat-value">{{weekValue}}</div>
            <div class="stat-label">This Week</div>
        </div>
        <div class="stat-item" data-stat="month">
            <div class="stat-value">{{monthValue}}</div>
            <div class="stat-label">This Month</div>
        </div>
    </div>
</div>
